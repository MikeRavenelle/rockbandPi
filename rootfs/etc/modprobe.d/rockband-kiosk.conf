# Xbox One/Series hardware is handled by xone. xpad-noone (installed as the
# "xpad" USB driver without Xbox One support) keeps Xbox 360 hardware working.
blacklist xpad
# The Xbox Wireless Adapter is driven by xone, not the mt76 Wi-Fi driver
blacklist mt76x2u

# YARG reads PlayStation-style devices straight from hidraw. These drivers
# would claim the bridge's virtual PS3 drum kit and DualShock 4 and fail to
# probe them, so leave them to hid-generic.
blacklist hid_sony
blacklist hid_playstation
