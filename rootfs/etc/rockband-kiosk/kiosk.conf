# Kiosk session settings (read by /opt/rockband-kiosk/kiosk-session.sh and
# yarg-launch.sh). Changes apply the next time YARG starts.
#
# Display mode the TV is driven at (60 Hz), e.g. 1280x720 or 1920x1080. YARG
# runs full screen at this size and the TV scales it up. Empty = the TV's own
# preferred mode, often 4K, which is far too heavy for the Pi's GPU. YARG's
# Resolution setting has no effect in full screen.
# 1280x720 (what the Xbox 360 games ran at) keeps songs above 60 FPS on a Pi 5;
# at 1920x1080 the highway needs YARG_HIGHWAY_SCALE=0.5 to get close.
DISPLAY_MODE=1280x720

# Highway render resolution as a fraction of DISPLAY_MODE, 0.5 to 1 (needs the
# YARG from scripts/build-yarg.sh). Lower is faster but blurrier; menus, lyrics
# and the score always stay at full resolution.
YARG_HIGHWAY_SCALE=0.75

# Graphics backend: vulkan or opengl. Vulkan needs the YARG built by
# scripts/build-yarg.sh (YARG_SOURCE=local); with the official v0.15.0 release
# the screen flickers or stays black (missing depth buffer format), so use
# opengl there. If YARG keeps crashing on Vulkan, the session switches to
# OpenGL by itself.
YARG_RENDERER=vulkan

# Choosing Quit in YARG: poweroff or restart
ON_QUIT=poweroff
