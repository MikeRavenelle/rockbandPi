# Kiosk session settings (read by /opt/rockband-kiosk/kiosk-session.sh and
# yarg-launch.sh). Changes apply the next time YARG starts.
#
# YARG's render resolution is a YARG setting (Settings > Graphics > Resolution,
# or "Resolution" in ~/.local/share/yarg/settings.json).

# Graphics backend: vulkan or opengl. Vulkan needs the YARG built by
# scripts/build-yarg.sh (YARG_SOURCE=local); with the official v0.15.0 release
# the screen flickers or stays black (missing depth buffer format), so use
# opengl there. If YARG keeps crashing on Vulkan, the session switches to
# OpenGL by itself.
YARG_RENDERER=vulkan

# Choosing Quit in YARG: poweroff or restart
ON_QUIT=poweroff
