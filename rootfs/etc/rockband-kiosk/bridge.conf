# rb-bridge: mirrors Xbox instruments/controllers as HID devices YARG reads on Linux

[drums]
# ps3:        Xbox 360 kits appear as a PS3 Rock Band kit (matched by USB ID; no velocity)
# santroller: appear as a Santroller kit, which also passes hit velocity
#             (for YARG's drum dynamics). Depends on PlasticBand's revision mapping.
mode = ps3
santroller_revision = 0x0500

[gamepads]
# Xbox 360/One/Series gamepads appear as a DualShock 4
enabled = true
