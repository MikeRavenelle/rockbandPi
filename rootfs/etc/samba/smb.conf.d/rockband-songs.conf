# Song library share: \\rockband.local\songs (Windows) or smb://rockband.local/songs (macOS)
[songs]
   comment = Rock Band song library
   path = /srv/songs
   browseable = yes
   read only = no
   valid users = __KIOSK_USER__
   force user = __KIOSK_USER__
   create mask = 0644
   directory mask = 0755
