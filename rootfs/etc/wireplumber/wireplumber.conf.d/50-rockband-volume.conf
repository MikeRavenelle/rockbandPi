# Start new audio outputs (the TV's HDMI) at full volume. WirePlumber's
# default is 40% on its cubic scale, about -24 dB, which is very quiet through
# a TV or a sound bar on HDMI ARC. Volume is set on the TV / sound bar instead.
wireplumber.settings = {
  device.routes.default-sink-volume = 1.0
}
